<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Moksh Prajapati - B.Tech CSE, Java and Backend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A101F"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22D3EE" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="259" rx="16" fill="none" stroke="#22D3EE" stroke-opacity="0.25"/>

  <!-- glowing orbs -->
  <circle cx="180" cy="200" r="70" fill="#22D3EE" opacity="0.18" filter="url(#blur)">
    <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="70" r="80" fill="#A78BFA" opacity="0.2" filter="url(#blur)">
    <animate attributeName="cx" values="820;740;820" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- window dots -->
  <circle cx="28" cy="26" r="5" fill="#FF5F56"/>
  <circle cx="46" cy="26" r="5" fill="#FFBD2E"/>
  <circle cx="64" cy="26" r="5" fill="#27C93F"/>
  <text x="86" y="31" font-family="'Courier New', monospace" font-size="13" fill="#64748B">~/moksh-prajapati</text>

  <!-- name -->
  <text x="500" y="112" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="60" font-weight="800" fill="url(#title)" opacity="0">
    Moksh Prajapati
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" begin="0.2s" dur="1s" fill="freeze"/>
  </text>

  <!-- underline draw -->
  <line x1="300" y1="134" x2="700" y2="134" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="400">
    <animate attributeName="stroke-dashoffset" from="400" to="0" begin="0.8s" dur="1s" fill="freeze"/>
  </line>

  <!-- subtitle -->
  <text x="500" y="176" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="24" fill="#A78BFA" opacity="0">
    B.Tech CSE  |  Java &amp; Backend Developer
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.8s" fill="freeze"/>
  </text>

  <!-- stack line -->
  <text x="500" y="214" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#10B981" opacity="0">
    Java  •  Spring Boot  •  Microservices  •  MongoDB
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.8s" fill="freeze"/>
  </text>

  <!-- blinking cursor -->
  <rect x="780" y="198" width="9" height="18" fill="#22D3EE" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1s" begin="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
